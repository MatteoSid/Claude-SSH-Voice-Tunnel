[project]
name = "claude-voice"
version = "0.1.0"
description = "Use Claude Code's native /voice over SSH by bridging your local microphone to the remote server."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sounddevice>=0.4.6"]

[project.scripts]
claude-voice = "claude_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_voice"]
